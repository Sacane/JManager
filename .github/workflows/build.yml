name: Build

env:
  GRADLE_OPTS: "-XX:MaxMetaspaceSize=512m -Xmx2g"

on:
  push:
    branches:
      - "**"

jobs:
  test-analysis:
    name: Test and analyze on all branches
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Allow execution permission
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew :domain:test :infra:test jacocoTestReport --info --stacktrace

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests with coverage
        working-directory: client
        run: pnpm test:coverage

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar --info

  build:
    name: Build and dispatch deploy
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: test-analysis
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      jar_file_name: ${{ steps.jar.outputs.jar_file_name }}
      jar_download_url: ${{ steps.jar.outputs.jar_download_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Allow execution permission
        run: |
          chmod +x ./gradlew
          chmod +x ./.github/scripts/bump-version.sh

      - name: Compute next version bump
        id: bump
        env:
          GIT_COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: ./.github/scripts/bump-version.sh

      - name: Build versioned JAR
        if: steps.bump.outputs.should_bump == 'true'
        run: ./gradlew clean build -x test --info -Pversion=${{ steps.bump.outputs.new_version }}

      - name: Compute JAR metadata
        if: steps.bump.outputs.should_bump == 'true'
        id: jar
        run: |
          JAR_FILE_NAME="Jmanager-${{ steps.bump.outputs.new_version }}.jar"
          JAR_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.bump.outputs.new_version }}/${JAR_FILE_NAME}"

          if [ ! -f "./executables/${JAR_FILE_NAME}" ]; then
            echo "Expected JAR not found: ./executables/${JAR_FILE_NAME}"
            ls -la ./executables || true
            exit 1
          fi

          echo "jar_file_name=${JAR_FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "jar_download_url=${JAR_DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release with JAR
        if: steps.bump.outputs.should_bump == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: v${{ steps.bump.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          files: ./executables/${{ steps.jar.outputs.jar_file_name }}
          fail_on_unmatched_files: true

      - name: Trigger Deploy repository
        if: steps.bump.outputs.should_bump == 'true'
        env:
          DEPLOY_REPO_PAT: ${{ secrets.DEPLOY_REPO_PAT }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY || 'Sacane/Deploy' }}
        run: |
          curl --fail --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DEPLOY_REPO_PAT}" \
            "https://api.github.com/repos/${DEPLOY_REPOSITORY}/dispatches" \
            --data @- <<JSON
          {
            "event_type": "jmanager_deploy",
            "client_payload": {
              "jar_version": "${{ steps.bump.outputs.new_version }}",
              "jar_download_url": "${{ steps.jar.outputs.jar_download_url }}",
              "jar_file_name": "${{ steps.jar.outputs.jar_file_name }}"
            }
          }
          JSON
