spring.profiles.group.test=test

# Datasource is provided by test configuration (Testcontainers) so we don't hardcode URL here
# Disable Hibernate auto DDL so Flyway manages schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
auth.secret=THIS-IS-A-TEST-JWT-SECRET-THAT-SHOULD-NOT-BE-USED-IN-PRODUCTION

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Admin credentials for tests
jmanager.admin.username=admin
jmanager.admin.password=admin123
