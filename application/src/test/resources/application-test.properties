spring.profiles.group.test=test

# Datasource is provided by test configuration (Testcontainers) so we don't hardcode URL here
# Disable Hibernate auto DDL so Flyway manages schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
auth.secret=THIS-IS-A-TEST-JWT-SECRET-THAT-SHOULD-NOT-BE-USED-IN-PRODUCTION

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Admin credentials for tests
jmanager.admin.username=admin
jmanager.admin.password=admin123

# Multipart file size limits for tests (higher than production to allow testing)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=WARN
logging.level.fr.sacane.jmanager=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.org.flywaydb=WARN

spring.main.banner-mode=off
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable data retention scheduler during tests (cron "-" = disabled in Spring 5.1+)
jmanager.retention.cron=-

# Disable real SMTP connection for tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.test-connection=false
