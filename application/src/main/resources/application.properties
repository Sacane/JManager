server.port=8080
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

spring.jpa.show-sql=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.tomcat.max-http-post-size=2097152

# Application URL (used in emails)
app.url=${APP_URL:http://localhost:3000}

# Actuator — health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Data retention (GDPR Art. 5(1)(e))
jmanager.retention.unconsented-account-days=30
jmanager.retention.cron=0 0 2 * * *

# Mail (SMTP)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:resend}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:noreply@jmanager.sacane.fr}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}